<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Beat Bugs</title>
<meta name="theme-color" content="#BFE8A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beat Bugs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
  /* Layout: a garden-bed board fills the middle (five rows: the tall top row plays a tune, the rest are drums), a creature button heads each row and opens the picker, and a playhead sweeps the eight beats; the scene buttons (meadow, forest, lake) sit top-centre (portrait) or in the control column (landscape); the controls (play, three speeds, surprise, clear) sit in a bar below (portrait) or a column on the right (landscape); home top-left, mute top-right; the picker (every creature plus "my sound" with the microphone) is an overlay */
  :root{
    --sky:#BFE8A6; --sky-top:#E6F7D8; --sky-bot:#A3D98A; --soil:#8B5E3C; --soil-edge:#6E4529; --bed:#A8D98A; --bed-alt:#98CF78;
    --cream:#FFF8E7; --lip:#E6D3A8; --ink:#2B2B3A;
    --go:#35C24A; --go-edge:#23912F; --stop:#F25C54; --stop-edge:#B83A33; --honey:#FFC93C; --honey-edge:#E59A00;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    --cell:56px; --cw:56px; --ch:56px; --gap:4px; --key:clamp(44px,12.5vw,60px); --pk:clamp(44px,min(12.5vw,11vh),60px);
    color-scheme: light;
  }
  body[data-scene=forest]{--sky:#9CCB8B;--sky-top:#D7EBC9;--sky-bot:#76AE66;--soil:#5C3D2A;--soil-edge:#3F2A1C;--bed:#8CBF72;--bed-alt:#7DB363}
  body[data-scene=lake]{--sky:#AEE0F7;--sky-top:#E3F5FF;--sky-bot:#86CBEF;--soil:#2F7FB0;--soil-edge:#1F5F88;--bed:#A3DCF4;--bed-alt:#8FD2EE}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;font-family:var(--title);color:var(--ink);
    background:radial-gradient(ellipse at 50% 0%,var(--sky-top) 0%,var(--sky) 60%,var(--sky-bot) 100%);
    touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr;transition:background .4s}
  button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
  svg{display:block}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #mute{position:fixed;z-index:50;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #mute svg{width:26px;height:26px}
  #mute:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- the board ---------- */
  #wrap{min-width:0;min-height:0;display:grid;place-items:center;padding:calc(66px + var(--st)) calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
  #board{position:relative;display:grid;gap:var(--gap);padding:var(--gap);border-radius:18px;background:var(--soil);box-shadow:0 6px 0 var(--soil-edge),0 12px 24px rgba(0,0,0,.18);
    grid-template-columns:var(--cw) repeat(8,var(--cw));grid-template-rows:calc(var(--ch)*1.9) repeat(4,var(--ch));transition:background .4s,box-shadow .4s}
  .head{border-radius:14px;background:var(--cream);box-shadow:inset 0 -4px 0 var(--lip);display:grid;place-items:center;position:relative}
  .head .bug{width:86%;height:86%}
  .head:active{transform:translateY(2px)}
  .head .swap{position:absolute;right:-3px;bottom:-3px;width:calc(var(--cell)*.34);height:calc(var(--cell)*.34);min-width:16px;min-height:16px;border-radius:50%;
    background:var(--honey);box-shadow:0 2px 0 var(--honey-edge);display:grid;place-items:center}
  .head .swap svg{width:70%;height:70%}
  .cell{position:relative;border-radius:12px;background:var(--bed);overflow:visible;display:grid;place-items:center;transition:background .4s}
  .cell.beat2{background:var(--bed-alt)}
  .cell::before{content:'';width:18%;height:18%;border-radius:50%;background:rgba(40,80,60,.2)}
  .cell.has::before{display:none}
  .cell .bug{position:absolute;width:88%;height:88%;left:6%;top:6%;pointer-events:none}
  .cell.tune{background:linear-gradient(to top,#FFD6E0 0 20%,#FFE8C7 20% 40%,#FFF6BF 40% 60%,#D8F5C8 60% 80%,#D3ECFF 80% 100%)}
  .cell.tune.beat2{filter:saturate(.8) brightness(.96)}
  .cell.tune::before{display:none}
  .tune .bug{width:calc(var(--cell)*.62);height:calc(var(--cell)*.62);left:calc(50% - var(--cell)*.31);top:auto;
    bottom:calc(var(--lane) * 20% + 10% - var(--cell)*.31)}
  #playhead{position:absolute;top:calc(var(--gap) - 3px);bottom:calc(var(--gap) - 3px);width:calc(var(--cw) + 6px);border-radius:14px;
    border:4px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.8);pointer-events:none;transition:transform .07s linear;z-index:5}

  /* the creatures: idle wiggle, a hop on their beat, singing mouth, flying away when cleared */
  .bug .mo{opacity:0}
  .cell .bug{animation:idle 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0) * -0.37s)}
  .cell.pop .bug{animation:popIn .3s ease-out}
  .cell.hit .bug,.head.hit .bug,.pick.hit .bug{animation:hop .32s ease-out}
  .cell.hit .bug .mo,.head.hit .bug .mo,.pick.hit .bug .mo{opacity:1}
  .cell.hit .bug .mc,.head.hit .bug .mc,.pick.hit .bug .mc{opacity:0}
  .cell.fly .bug{animation:flyAway .6s ease-in forwards;animation-delay:calc(var(--d,0) * 0.02s)}
  .note{position:absolute;left:50%;top:10%;font:bold calc(var(--cell)*.32)/1 Verdana,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
    pointer-events:none;animation:noteUp .7s ease-out forwards;z-index:6}

  /* ---------- controls ---------- */
  #controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px calc(10px + var(--sr)) calc(12px + var(--sb)) calc(10px + var(--sl));
    background:rgba(255,248,231,.75);border-top:4px solid rgba(230,211,168,.9)}
  .key{width:var(--key);height:var(--key);border-radius:50%;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:grid;place-items:center;font-size:calc(var(--key)*.5);line-height:1}
  .key svg{width:58%;height:58%}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  .key.on{background:var(--honey);box-shadow:0 4px 0 var(--honey-edge)}
  #more{display:flex;gap:8px}
  #tempo,#scenes{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(230,211,168,.45)}
  #scenes{position:fixed;z-index:45;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.55)}
  #scenes .key{width:44px;height:44px;font-size:24px}
  #play{width:calc(var(--key)*1.45);height:calc(var(--key)*1.45);border-radius:50%;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #play svg{width:50%;height:50%}
  #play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}
  #play.stop{background:var(--stop);box-shadow:0 6px 0 var(--stop-edge)}
  #clear.undo{background:#D3ECFF;box-shadow:0 4px 0 #9cc4e4}

  /* wide, short screens (a tablet or phone held sideways): controls go to the right, the scenes join them */
  @media (min-aspect-ratio:5/4){
    body{grid-template-rows:1fr;grid-template-columns:1fr auto}
    #wrap{padding:calc(10px + var(--st)) 8px calc(10px + var(--sb)) calc(62px + var(--sl))}
    #controls{flex-direction:column;gap:10px;border-top:0;border-left:4px solid rgba(230,211,168,.9);padding:calc(62px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) 12px}
    #scenes{position:static;transform:none;background:rgba(230,211,168,.45)}
    #scenes .key{width:var(--key);height:var(--key);font-size:calc(var(--key)*.5)}
    :root{--key:clamp(44px,11vh,60px)}
  }

  /* ---------- the picker ---------- */
  #picker{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(43,43,58,.35);padding:10px}
  #picker .sheet{background:var(--cream);border-radius:24px;box-shadow:0 8px 0 var(--lip),0 16px 40px rgba(0,0,0,.25);padding:10px;
    display:flex;flex-direction:column;align-items:stretch;gap:6px;max-width:100%;animation:popIn .25s ease-out}
  .prow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:16px}
  .prow.meadow{background:#DDF3CC} .prow.forest{background:#CFE3C2} .prow.lake{background:#D3ECFF} .prow.me{background:#FFE3E8}
  .ptag{width:calc(var(--pk)*.62);font-size:calc(var(--pk)*.48);line-height:1;text-align:center}
  .pick{width:var(--pk);height:var(--pk);border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);display:grid;place-items:center;position:relative}
  .pick .bug{width:88%;height:88%}
  .pick.on{box-shadow:0 0 0 4px var(--honey-edge),0 3px 0 rgba(0,0,0,.12)}
  .pick.off{opacity:.35}
  .pick .no{position:absolute;right:-4px;top:-4px;font-size:calc(var(--pk)*.34)}
  #recbox{display:flex;gap:8px;align-items:center;margin-left:4px}
  #rec{width:var(--pk);height:var(--pk);border-radius:50%;background:var(--stop);box-shadow:0 4px 0 var(--stop-edge),0 0 0 calc(var(--lvl,0) * 16px) rgba(242,92,84,.35);
    display:grid;place-items:center;transition:box-shadow .06s}
  #rec svg{width:46%;height:46%}
  #rec.ask{animation:pulse 1.1s ease-in-out infinite}
  #rec.live{background:#C92A2A}
  .mini{width:calc(var(--pk)*.82);height:calc(var(--pk)*.82);border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);display:grid;place-items:center}
  .mini svg{width:55%;height:55%}
  #pickdone{align-self:center;width:calc(var(--pk)*1.15);height:calc(var(--pk)*1.15);border-radius:50%;background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go-edge);display:grid;place-items:center;margin-top:4px}
  #pickdone svg{width:52%;height:52%}

  @keyframes idle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2%)}}
  @keyframes popIn{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22%) scale(1.18,1.1)}70%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
  @keyframes flyAway{0%{transform:none;opacity:1}100%{transform:translate(40%,-260%) rotate(40deg) scale(.4);opacity:0}}
  @keyframes noteUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(-10%,-140%) scale(1.1);opacity:0}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body data-scene="meadow">
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<button id="mute" aria-label="Sound on or off"></button>
<div id="wrap"><div id="board"><div id="playhead" hidden></div></div></div>
<div id="controls">
  <div id="scenes"></div>
  <button id="play" aria-label="Play"></button>
  <div id="tempo"></div>
  <div id="more">
    <button id="dice" class="key" aria-label="Surprise me">🎲</button>
    <button id="clear" class="key" aria-label="Clear the garden"></button>
  </div>
</div>
<div id="picker" hidden>
  <div class="sheet" role="dialog" aria-label="Pick a sound">
    <div id="picks"></div>
    <button id="pickdone" aria-label="Done"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script>
/* ======== tuning knobs ======== */
const STEPS = 8;                 // beats across the board (eighth notes, so one bar of 4/4)
const ROW_COUNT = 5;             // row 0 is the tall tune row, rows 1-4 are drums
const TEMPOS = [                 // the three speed buttons; bpm counts quarter notes
  { icon: '🐌', bpm: 76, label: 'Slow' },
  { icon: '🐇', bpm: 100, label: 'Medium' },
  { icon: '🐆', bpm: 128, label: 'Fast' },
];
const MELODY = [67, 69, 72, 74, 76]; // the tune row's five lanes, bottom to top (G A C D E, C major pentatonic, MIDI notes)
const LOOKAHEAD = 0.15;          // seconds of notes queued ahead of the audio clock
const TICK_MS = 25;              // how often the scheduler tops up the queue
const UNDO_MS = 5000;            // how long the clear button offers to bring the creatures back
const USE_CLIPS = true;          // the ElevenLabs clips in assets/ (see README); false plays everything synthesized
const ASSET_V = 1;               // bump after replacing any file in assets/
const WHOOSH_TRIM = 0.62;        // volume of the "flying away" clip
const REC_MAX = 2;               // longest microphone recording, seconds
const REC_KEEP = 1.5;            // longest sound kept once the silence is trimmed off
const REC_SILENCE = 0.45;        // the recording stops this long after the voice goes quiet
const REC_RATE = 16000;          // recordings are kept at about this sample rate (small enough for localStorage)

// Every creature: its scene, its clip (assets/<clip>.mp3), how loud (trim) and which part of the clip plays
// (cut: [start, length] in seconds), and for the ones that sing a note, that note (base, MIDI, measured from the
// clip) so the tune row can pitch them; octave moves the tune up for very high singers. The others play the tune by
// speeding up or slowing down around their own sound. 'me' is the row's own microphone recording.
const CREATURES = {
  bee:        { scene: 'meadow', label: 'Bee', clip: 'bug-bee', trim: 0.6, cut: [0, 0.32], base: 64.65 },
  cricket:    { scene: 'meadow', label: 'Cricket', clip: 'bug-cricket', trim: 1.35, cut: [0.01, 0.07] },
  ladybird:   { scene: 'meadow', label: 'Ladybird', clip: 'bug-ladybird', trim: 7.2 },
  frog:       { scene: 'meadow', label: 'Frog', clip: 'bug-frog', trim: 0.48, cut: [0, 0.35] },
  beetle:     { scene: 'meadow', label: 'Beetle', clip: 'bug-beetle', trim: 5.6 },
  bird:       { scene: 'forest', label: 'Songbird', clip: 'forest-bird', trim: 0.67, cut: [0.09, 0.2], base: 87.1, octave: 1 },
  woodpecker: { scene: 'forest', label: 'Woodpecker', clip: 'forest-woodpecker', trim: 0.51, cut: [0.035, 0.09] },
  squirrel:   { scene: 'forest', label: 'Squirrel', clip: 'forest-squirrel', trim: 0.84, cut: [0, 0.08] },
  owl:        { scene: 'forest', label: 'Owl', clip: 'forest-owl', trim: 0.66, cut: [0, 0.25], base: 60.42, octave: -1 },
  bear:       { scene: 'forest', label: 'Bear', clip: 'forest-bear', trim: 14, cut: [0, 0.35] },
  fish:       { scene: 'lake', label: 'Fish', clip: 'lake-fish', trim: 0.44, cut: [0.045, 0.16], base: 70.3 },
  dragonfly:  { scene: 'lake', label: 'Dragonfly', clip: 'lake-dragonfly', trim: 1.58, cut: [0, 0.14] },
  beaver:     { scene: 'lake', label: 'Beaver', clip: 'lake-beaver', trim: 3.5, cut: [0, 0.2] },
  duck:       { scene: 'lake', label: 'Duck', clip: 'lake-duck', trim: 0.51, cut: [0.058, 0.13] },
  turtle:     { scene: 'lake', label: 'Turtle', clip: 'lake-turtle', trim: 0.98, cut: [0.14, 0.08] },
  me:         { scene: 'me', label: 'My sound' },
};
// A scene fills the five rows (tune row first) and colours the garden.
const SCENES = [
  { id: 'meadow', icon: '🌼', label: 'Meadow', theme: '#BFE8A6', rows: ['bee', 'cricket', 'ladybird', 'frog', 'beetle'] },
  { id: 'forest', icon: '🌲', label: 'Forest', theme: '#9CCB8B', rows: ['bird', 'woodpecker', 'squirrel', 'owl', 'bear'] },
  { id: 'lake',   icon: '🌊', label: 'Lake',   theme: '#AEE0F7', rows: ['fish', 'dragonfly', 'beaver', 'duck', 'turtle'] },
];
// Patterns for the dice, one string per row (tune row first): x = a creature, digits are tune lanes, . = empty
const SURPRISES = [
  ['0.2.4.2.', 'x.x.x.x.', '..x...x.', 'x.....x.', 'x...x...'],
  ['4.3.2.0.', 'xxxxxxxx', '..x...x.', '...x...x', 'x..x..x.'],
  ['2..2.4..', '.x.x.x.x', '....x...', 'x.x.....', 'x.......'],
  ['0.1.2.3.', 'x..xx..x', '..x..x..', 'x...x...', 'x.x...x.'],
  ['........', 'x.x.x.x.', '..x...x.', '.x...x..', 'x...x.x.'],
];
const START_PATTERN = ['0...2...', 'x.x.x.x.', '..x...x.', '........', 'x...x...'];

/* ======== small helpers ======== */
const NS = 'beatbugs.';
const load = (k, d = null) => { try { const v = localStorage.getItem(NS + k); return v === null ? d : v; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, String(v)); return true; } catch { return false; } };
const forget = (k) => { try { localStorage.removeItem(NS + k); } catch {} };
const TEST = /[?&]tbxtest\b/.test(location.search) || navigator.webdriver === true;
const $ = (id) => document.getElementById(id);
const midiHz = (m) => 440 * 2 ** ((m - 69) / 12);
const isTune = (ri) => ri === 0;

/* ======== creature pictures ======== */
// Every creature faces you; .mc is the closed mouth, .mo the open singing one.
const EYES = (y, x1 = 25, x2 = 35, r = 4.6) => `<circle cx="${x1}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x2}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x1 + 0.8}" cy="${y + 0.8}" r="${r * 0.52}" fill="#1b1b24"/><circle cx="${x2 + 0.8}" cy="${y + 0.8}" r="${r * 0.52}" fill="#1b1b24"/><circle cx="${x1 + 1.8}" cy="${y - 0.6}" r="${r * 0.2}" fill="#fff"/><circle cx="${x2 + 1.8}" cy="${y - 0.6}" r="${r * 0.2}" fill="#fff"/>`;
const MOUTH = (y, stroke = '#fff', w = 4) => `<path class="mc" d="M${30 - w} ${y}q${w} 3.4 ${w * 2} 0" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/><ellipse class="mo" cx="30" cy="${y + 1.2}" rx="2.8" ry="3.2" fill="#ff5d7e" stroke="${stroke}" stroke-width="1.2"/>`;
const BEAK = (y, c = '#FFB020', edge = '#c77d00') => `<path class="mc" d="M26 ${y}h8l-4 5z" fill="${c}" stroke="${edge}" stroke-width="1" stroke-linejoin="round"/><g class="mo"><path d="M26 ${y - 1}h8l-4-3.5z" fill="${c}" stroke="${edge}" stroke-width="1" stroke-linejoin="round"/><ellipse cx="30" cy="${y + 1}" rx="3" ry="2" fill="#ff5d7e"/><path d="M26 ${y + 2}h8l-4 4.5z" fill="${c}" stroke="${edge}" stroke-width="1" stroke-linejoin="round"/></g>`;
const LEGS = (c) => `<g stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none"><path d="M15 32 7 28M14 40 6 42M17 48 10 54M45 32l8-4M46 40l8 2M43 48l7 6"/></g>`;

  beetle: `${LEGS('#1f2a37')}<ellipse cx="30" cy="39" rx="17" ry="16" fill="#2E8B9A"/><path d="M30 25v30" stroke="#1d6470" stroke-width="2.5"/><ellipse cx="22" cy="36" rx="3" ry="5" fill="#7fd1dc" opacity=".8"/><path d="M27 12l3-9 3 9z" fill="#1f2a37"/><circle cx="30" cy="20" r="10.5" fill="#1f2a37"/>${EYES(18)}${MOUTH(24.5)}`,

/* ======== rows: which creature sings in each row ======== */
let kit = (() => {
  try { const k = JSON.parse(load('kit', 'null')); if (Array.isArray(k) && k.length === ROW_COUNT && k.every((id) => id in CREATURES)) return k; } catch {}
  return [...SCENES[0].rows];
})();
let sceneId = SCENES.some((s) => s.id === load('scene')) ? load('scene') : 'meadow';
const saveKit = () => save('kit', JSON.stringify(kit));

/* ======== my own sounds (recordings) ======== */
// A row playing "my sound" uses its own recording. Recordings stay on this device: localStorage (beatbugs.rec<row>),
// about 16 kHz 16-bit, never uploaded or sent anywhere. The bin in the picker deletes them.
const recs = [];   // per row: { data: Float32Array, rate } or undefined
function encodeRec(r) {
  const i16 = new Int16Array(r.data.length); for (let i = 0; i < i16.length; i++) i16[i] = Math.max(-1, Math.min(1, r.data[i])) * 32767;
  const u8 = new Uint8Array(i16.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return JSON.stringify({ rate: r.rate, pcm: btoa(s) });
}
function decodeRec(txt) {
  try {
    const o = JSON.parse(txt), bin = atob(o.pcm), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const i16 = new Int16Array(u8.buffer), data = new Float32Array(i16.length); for (let i = 0; i < data.length; i++) data[i] = i16[i] / 32767;
    return data.length && o.rate >= 3000 ? { data, rate: o.rate } : undefined;
  } catch { return undefined; }
}
for (let ri = 0; ri < ROW_COUNT; ri++) { const t = load('rec' + ri); if (t) recs[ri] = decodeRec(t); }
function storeRec(ri) { if (recs[ri]) save('rec' + ri, encodeRec(recs[ri])); else forget('rec' + ri); }   // if storage is full the sound still works until the page closes

/* ======== sound ======== */
// Each creature has a synthesized voice. With USE_CLIPS on, its recorded clip replaces it once loaded, and the
// synthesized voice stays as the fallback (Blast Off pattern). The tune row pitches every sound with playbackRate.
const CLIPS = [...new Set(Object.values(CREATURES).map((c) => c.clip).filter(Boolean)), 'sfx-whoosh'];
const Sound = (() => {
  let ac = null, out = null, noiseBuf = null;
  let muted = TEST || load('muted') === '1';
  const raw = {}, clips = {}, recBufs = [];   // clip bytes start loading now; decoding needs the AudioContext from the first tap
  if (USE_CLIPS && !TEST) for (const n of CLIPS) raw[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then((r) => r.ok ? r.arrayBuffer() : null).catch(() => null);
  function ctx() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.8; out.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      for (const n in raw) raw[n].then((b) => b && new Promise((res, rej) => ac.decodeAudioData(b, res, rej)))
        .then((buf) => { if (buf) clips[n] = buf; }).catch(() => {});
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(t, peak, dur, attack = 0.005) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, f2) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function noise(t, dur, type, f, q, dest) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    s.connect(fl); fl.connect(dest); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
  }
  function playBuf(buf, t, rate, vol, off = 0, len = buf.duration - off) {
    const s = ac.createBufferSource(), g = ac.createGain(), end = t + len / rate;
    s.buffer = buf; s.playbackRate.value = rate;
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, Math.max(t, end - 0.02)); g.gain.linearRampToValueAtTime(0, end);   // short fade, no click at the cut
    s.connect(g).connect(out); s.start(t, off); s.stop(end + 0.01);
  }
  function recBuf(ri) {
    const r = recs[ri]; if (!r) return null;
    if (!recBufs[ri] || recBufs[ri].src !== r) { const b = ac.createBuffer(1, r.data.length, r.rate); b.getChannelData(0).set(r.data); recBufs[ri] = { src: r, buf: b }; }
    return recBufs[ri].buf;
  }
  // synthesized voices; r scales the pitch (1 = the creature's own sound)
  const SYNTH = {
    beetle(t, r) { osc('sine', 150 * r, t, 0.32, env(t, 0.9, 0.32), 42 * r); osc('triangle', 90 * r, t, 0.05, env(t, 0.25, 0.05)); },
    ladybird(t, r) { for (let i = 0; i < 3; i++) { const tt = t + i * 0.012; noise(tt, 0.18, 'bandpass', 1400 * r, 1.2, env(tt, i === 2 ? 0.5 : 0.3, i === 2 ? 0.16 : 0.02, 0.002)); } },
    cricket(t, r) { for (let i = 0; i < 3; i++) osc('sine', 4300 * r, t + i * 0.022, 0.016, env(t + i * 0.022, 0.12, 0.016, 0.002)); },
    frog(t, r) {
      [0, 0.1].forEach((d, i) => {
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; f.connect(env(t + d, 0.4, 0.09, 0.008));
        osc('sawtooth', (i ? 110 : 98) * r, t + d, 0.09, f, (i ? 92 : 110) * r);
      });
    },
    bee(t, r) {
      const hz = midiHz(CREATURES.bee.base) * r;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800; f.connect(env(t, 0.22, 0.28, 0.02));
      const o = osc('sawtooth', hz, t, 0.28, f);

    bird(t, r) { const hz = midiHz(CREATURES.bird.base) * r; osc('sine', hz * 1.08, t, 0.16, env(t, 0.2, 0.16, 0.01), hz * 0.92); },
    woodpecker(t, r) { noise(t, 0.04, 'bandpass', 1800 * r, 6, env(t, 0.9, 0.035, 0.001)); osc('triangle', 900 * r, t, 0.02, env(t, 0.15, 0.02, 0.001)); },
    squirrel(t, r) { noise(t, 0.05, 'highpass', 2500 * r, 0.8, env(t, 0.5, 0.04, 0.001)); },
    owl(t, r) { const hz = midiHz(CREATURES.owl.base) * r; osc('sine', hz, t, 0.26, env(t, 0.3, 0.26, 0.04), hz * 0.96); osc('sine', hz * 2, t, 0.2, env(t, 0.04, 0.2, 0.04)); },
    bear(t, r) { osc('sine', 110 * r, t, 0.3, env(t, 0.9, 0.3), 60 * r); osc('triangle', 220 * r, t, 0.06, env(t, 0.2, 0.06)); noise(t, 0.05, 'bandpass', 300 * r, 2, env(t, 0.3, 0.05, 0.002)); },

})();

/* ======== the microphone ======== */
// Records one short sound, stopping by itself when the voice goes quiet (or after REC_MAX seconds); tap again to stop
// sooner. It uses its own AudioContext and switches the microphone off straight after, so the game's sound comes back
// to the speaker. Only works where the browser allows it (https or localhost), and only after a parent says yes.
const Mic = {
  ok: TEST || !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext)),
  denied: false, stop: null,
  async record(onLevel) {
    if (TEST) return Mic.fake(onLevel);
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC(); ctx.resume();   // made inside the tap, so iPhones let it run
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { ctx.close(); if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) Mic.denied = true; throw e; }
    const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(2048, 1, 1), hush = ctx.createGain();
    hush.gain.value = 0; src.connect(proc); proc.connect(hush); hush.connect(ctx.destination);
    return new Promise((resolve) => {
      const chunks = []; let n = 0, heard = false, quiet = 0, done = false;
      const finish = () => {
        if (done) return; done = true; Mic.stop = null;
        proc.onaudioprocess = null; src.disconnect(); proc.disconnect(); stream.getTracks().forEach((tr) => tr.stop());
        const rate = ctx.sampleRate; ctx.close();
        const data = new Float32Array(n); let o = 0; for (const c of chunks) { data.set(c, o); o += c.length; }
        resolve({ data, rate });
      };
      Mic.stop = finish;
      proc.onaudioprocess = (e) => {
        const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); n += d.length;
        let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
        const rms = Math.sqrt(s / d.length); onLevel?.(rms);
        if (rms > 0.02) { heard = true; quiet = 0; } else if (heard) quiet += d.length / ctx.sampleRate;
        if ((heard && quiet > REC_SILENCE) || n / ctx.sampleRate > REC_MAX) finish();
      };
    });
  },
  // tests (?tbxtest) never touch the microphone: a made-up "boo" with silence around it goes through the same shaping
  async fake(onLevel) {
    const rate = 48000, data = new Float32Array(rate);
    for (let i = 0; i < data.length; i++) { const t = i / rate; data[i] = 0.002 * Math.sin(i * 1.7) + (t > 0.3 && t < 0.62 ? 0.4 * Math.sin(2 * Math.PI * 220 * t) * Math.sin(Math.PI * (t - 0.3) / 0.32) : 0); }
    onLevel?.(0.3); return { data, rate };
  },
};
// trim the silence off both ends, keep at most REC_KEEP seconds, bring it down to about REC_RATE, level it, fade the ends
function shapeRecording({ data, rate }) {
  let pk = 0; for (let i = 0; i < data.length; i++) pk = Math.max(pk, Math.abs(data[i]));
  if (pk < 0.01) return null;                                   // nothing heard
  const th = pk * 0.08; let a = 0, b = data.length - 1;
  while (a < b && Math.abs(data[a]) < th) a++;
  while (b > a && Math.abs(data[b]) < th) b--;
  a = Math.max(0, a - Math.round(rate * 0.01));
  b = Math.min(data.length, b + Math.round(rate * 0.05), a + Math.round(rate * REC_KEEP));
  const k = Math.max(1, Math.round(rate / REC_RATE)), outRate = rate / k, n = Math.floor((b - a) / k), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < k; j++) s += data[a + i * k + j]; out[i] = s / k; }
  let p2 = 0; for (let i = 0; i < n; i++) p2 = Math.max(p2, Math.abs(out[i]));
  const g = 0.9 / (p2 || 1), fi = Math.round(outRate * 0.005), fo = Math.round(outRate * 0.03);
  for (let i = 0; i < n; i++) out[i] *= g * Math.min(1, i / fi, (n - 1 - i) / fo);
  return n > outRate * 0.03 ? { data: out, rate: outRate } : null;
}

/* ======== pattern ======== */
let pat = [], tempo = 1, undoPat = null, undoTimer = 0;

  });
}

  try { const p = JSON.parse(load('rows', 'null')); if (ok(p)) return p; } catch {}
  try {   // the first version saved the pattern by bug name
    const old = JSON.parse(load('pattern', 'null')), p = old && SCENES[0].rows.map((id) => old[id]);
    if (p && ok(p)) return p;

}

pat = loadPattern();
tempo = Math.min(TEMPOS.length - 1, Math.max(0, +load('tempo', 1) || 0));

/* ======== the board ======== */

for (let ri = 0; ri < ROW_COUNT; ri++) {

function renderRow(ri, popIt = false) { renderHead(ri); for (let s = 0; s < STEPS; s++) renderCell(ri, s, popIt && isOn(ri, s)); }

board.addEventListener('click', (e) => {
  const head = e.target.closest('.head');

    const box = c.getBoundingClientRect();
    const lane = Math.max(0, Math.min(4, Math.floor((box.bottom - e.clientY) / box.height * 5)));
    pat[ri][s] = pat[ri][s] === lane ? -1 : lane;
  } else pat[ri][s] = pat[ri][s] ? 0 : 1;
  const on = isOn(ri, s);
  renderCell(ri, s, on);
  if (on) Sound.play(ri, 0, isTune(ri) ? pat[ri][s] : null);
  dropUndo(); savePattern();

/* ======== the picker ======== */

}

    const shaped = shapeRecording(raw);

    }

/* ======== sizing ======== */
function fit() {
  const wrap = $('wrap'), cs = getComputedStyle(wrap);
  const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = Math.max(3, Math.min(6, Math.round(Math.min(w, h) / 90)));
  // columns as wide as fit; rows may grow up to 1.6x taller (portrait phones) or squeeze cells narrower (landscape)
  const rowsTall = ROW_COUNT - 1 + 1.9;
  let cw = Math.min((w - gap * 10) / (STEPS + 1), 104);
  const ch = Math.floor(Math.max(24, Math.min((h - gap * 6) / rowsTall, cw * 1.6, 120)));
  cw = Math.floor(Math.max(24, Math.min(cw, ch * 1.3)));
  const root = document.documentElement.style;
  root.setProperty('--cw', cw + 'px'); root.setProperty('--ch', ch + 'px'); root.setProperty('--cell', Math.min(cw, ch) + 'px');
  root.setProperty('--gap', gap + 'px');
  placePlayhead(seq.shown);
}
function placePlayhead(s) {
  if (s < 0) { playhead.hidden = true; return; }
  const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw'));
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  playhead.hidden = false;
  playhead.style.left = (gap + cell + gap - 3) + 'px';
  playhead.style.transform = `translateX(${s * (cell + gap)}px)`;
}

/* ======== sequencer ======== */
// A lookahead scheduler (like Robot Spy's music) queues each beat ~0.15 s ahead of the audio clock; the pictures follow
// the queue so the hop lands with the sound. Muted (or in a test) it runs on the page clock instead, silently.
const seq = {
  on: false, step: 0, next: 0, timer: 0, queue: [], shown: -1,
  now() { const c = Sound.ctx; return c ? c.currentTime : performance.now() / 1000; },
  stepDur() { return 60 / TEMPOS[tempo].bpm / 2; },
  start() {
    if (this.on) return;
    Sound.unlock();
    this.on = true; this.step = 0; this.queue = []; this.next = this.now() + 0.06;
    this.timer = setInterval(() => this.schedule(), TICK_MS); this.schedule();
    renderPlay();
    window.tbxEvent?.('play', { bugs: bugCount(), tempo: TEMPOS[tempo].label.toLowerCase(), kit: kit.join(',') });
  },
  stop() {
    this.on = false; clearInterval(this.timer); this.queue = []; this.shown = -1;
    placePlayhead(-1); renderPlay();
  },
  restart() { if (this.on) { this.stop(); this.start(); } },
  schedule() {
    const now = this.now();
    if (this.next < now - 0.05) this.next = now + 0.05;   // timer was held up: skip missed beats rather than play them in a burst
    while (this.next < now + LOOKAHEAD) {
      const s = this.step % STEPS;
      for (let ri = 0; ri < ROW_COUNT; ri++) if (isOn(ri, s)) Sound.play(ri, this.next, isTune(ri) ? pat[ri][s] : null);
      this.queue.push({ s, t: this.next }); if (this.queue.length > 64) this.queue.shift();   // no frames drawn (hidden pane): don't pile up
      this.next += this.stepDur(); this.step++;
    }
  },
};
function frame() {
  if (seq.on) {
    const now = seq.now();
    while (seq.queue.length && seq.queue[0].t <= now) {
      const { s } = seq.queue.shift();
      seq.shown = s; placePlayhead(s);
      for (let ri = 0; ri < ROW_COUNT; ri++) if (isOn(ri, s)) sing(cells[ri][s]);
    }
  }
  requestAnimationFrame(frame);
}

  let started = false, newer = false, hiddenAt = 0;
