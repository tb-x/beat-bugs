<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Beat Bugs</title>
<meta name="theme-color" content="#BFE8A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beat Bugs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
  /* Layout: a garden-bed board fills the middle (one row per bug: the tall bee row on top plays a tune, the rest are drums), a bug button heads each row and a playhead sweeps the eight beats; the controls (play, three speeds, surprise, clear) sit in a bar below (portrait) or a column on the right (landscape); home top-left, mute top-right */
  :root{
    --sky:#BFE8A6; --soil:#8B5E3C; --soil-edge:#6E4529; --bed:#A8D98A; --bed-alt:#98CF78; --cream:#FFF8E7; --lip:#E6D3A8; --ink:#2B2B3A;
    --go:#35C24A; --go-edge:#23912F; --stop:#F25C54; --stop-edge:#B83A33; --honey:#FFC93C; --honey-edge:#E59A00;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    --cell:56px; --cw:56px; --ch:56px; --gap:4px; --key:clamp(44px,12.5vw,60px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;font-family:var(--title);color:var(--ink);
    background:radial-gradient(ellipse at 50% 0%,#E6F7D8 0%,var(--sky) 60%,#A3D98A 100%);
    touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr}
  button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
  svg{display:block}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #mute{position:fixed;z-index:50;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #mute svg{width:26px;height:26px}
  #mute:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #title{position:fixed;top:calc(14px + var(--st));left:0;right:0;text-align:center;font-size:26px;color:#3d6b2a;pointer-events:none;
    text-shadow:0 2px 0 rgba(255,255,255,.7)}

  /* ---------- the board ---------- */
  #wrap{min-width:0;min-height:0;display:grid;place-items:center;padding:calc(62px + var(--st)) calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
  #board{position:relative;display:grid;gap:var(--gap);padding:var(--gap);border-radius:18px;background:var(--soil);box-shadow:0 6px 0 var(--soil-edge),0 12px 24px rgba(0,0,0,.18);
    grid-template-columns:var(--cw) repeat(8,var(--cw));grid-template-rows:calc(var(--ch)*1.9) repeat(4,var(--ch))}
  .head{border-radius:14px;background:var(--cream);box-shadow:inset 0 -4px 0 var(--lip);display:grid;place-items:center;position:relative}
  .head .bug{width:86%;height:86%}
  .head:active{transform:translateY(2px)}
  .cell{position:relative;border-radius:12px;background:var(--bed);overflow:visible;display:grid;place-items:center}
  .cell.beat2{background:var(--bed-alt)}
  .cell::before{content:'';width:18%;height:18%;border-radius:50%;background:rgba(60,110,40,.22)}
  .cell.has::before{display:none}
  .cell .bug{position:absolute;width:88%;height:88%;left:6%;top:6%;pointer-events:none}
  .cell.tune{background:linear-gradient(to top,#FFD6E0 0 20%,#FFE8C7 20% 40%,#FFF6BF 40% 60%,#D8F5C8 60% 80%,#D3ECFF 80% 100%)}
  .cell.tune.beat2{filter:saturate(.8) brightness(.96)}
  .cell.tune::before{display:none}
  .tune .bug{width:calc(var(--cell)*.62);height:calc(var(--cell)*.62);left:calc(50% - var(--cell)*.31);top:auto;
    bottom:calc(var(--lane) * 20% + 10% - var(--cell)*.31)}
  #playhead{position:absolute;top:calc(var(--gap) - 3px);bottom:calc(var(--gap) - 3px);width:calc(var(--cw) + 6px);border-radius:14px;
    border:4px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.8);pointer-events:none;transition:transform .07s linear;z-index:5}

  /* the bugs: idle wiggle, a hop on their beat, singing mouth, flying away when cleared */
  .bug .mo{opacity:0}
  .cell .bug{animation:idle 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0) * -0.37s)}
  .cell.pop .bug{animation:popIn .3s ease-out}
  .cell.hit .bug,.head.hit .bug{animation:hop .32s ease-out}
  .cell.hit .bug .mo,.head.hit .bug .mo{opacity:1}
  .cell.hit .bug .mc,.head.hit .bug .mc{opacity:0}
  .cell.fly .bug{animation:flyAway .6s ease-in forwards;animation-delay:calc(var(--d,0) * 0.02s)}
  .note{position:absolute;left:50%;top:10%;font:bold calc(var(--cell)*.32)/1 Verdana,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
    pointer-events:none;animation:noteUp .7s ease-out forwards;z-index:6}

  /* ---------- controls ---------- */
  #controls{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px calc(10px + var(--sr)) calc(12px + var(--sb)) calc(10px + var(--sl));
    background:rgba(255,248,231,.75);border-top:4px solid rgba(230,211,168,.9)}
  .key{width:var(--key);height:var(--key);border-radius:50%;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:grid;place-items:center;font-size:calc(var(--key)*.5);line-height:1}
  .key svg{width:58%;height:58%}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  .key.on{background:var(--honey);box-shadow:0 4px 0 var(--honey-edge)}
  #more{display:flex;gap:8px}
  #tempo{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(230,211,168,.45)}
  #play{width:calc(var(--key)*1.45);height:calc(var(--key)*1.45);border-radius:50%;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #play svg{width:50%;height:50%}
  #play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}
  #play.stop{background:var(--stop);box-shadow:0 6px 0 var(--stop-edge)}
  #clear.undo{background:#D3ECFF;box-shadow:0 4px 0 #9cc4e4}

  /* wide, short screens (a tablet or phone held sideways): controls go to the right */
  @media (min-aspect-ratio:5/4){
    body{grid-template-rows:1fr;grid-template-columns:1fr auto}
    #wrap{padding:calc(10px + var(--st)) 8px calc(10px + var(--sb)) calc(62px + var(--sl))}
    #title{display:none}
    #controls{flex-direction:column;gap:12px;border-top:0;border-left:4px solid rgba(230,211,168,.9);padding:calc(64px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) 12px}
    :root{--key:clamp(44px,12vh,60px)}
  }

  @keyframes idle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2%)}}
  @keyframes popIn{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22%) scale(1.18,1.1)}70%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
  @keyframes flyAway{0%{transform:none;opacity:1}100%{transform:translate(40%,-260%) rotate(40deg) scale(.4);opacity:0}}
  @keyframes noteUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(-10%,-140%) scale(1.1);opacity:0}}
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<div id="title">Beat Bugs</div>
<button id="mute" aria-label="Sound on or off"></button>
<div id="wrap"><div id="board"><div id="playhead" hidden></div></div></div>
<div id="controls">
  <button id="play" aria-label="Play"></button>
  <div id="tempo"></div>
  <div id="more">
    <button id="dice" class="key" aria-label="Surprise me">🎲</button>
    <button id="clear" class="key" aria-label="Clear the garden"></button>
  </div>
</div>

<script>
/* ======== tuning knobs ======== */
const STEPS = 8;                 // beats across the board (eighth notes, so one bar of 4/4)
const TEMPOS = [                 // the three speed buttons; bpm counts quarter notes
  { icon: '🐌', bpm: 76, label: 'Slow' },
  { icon: '🐇', bpm: 100, label: 'Medium' },
  { icon: '🐆', bpm: 128, label: 'Fast' },
];
const MELODY = [67, 69, 72, 74, 76]; // the bee row's five lanes, bottom to top (G A C D E, C major pentatonic, MIDI notes)
const BEE_BASE = 64.65;          // the note the recorded bee hums (measured, median over the clip); playbackRate 1.15-1.93 shifts it to each lane
const LOOKAHEAD = 0.15;          // seconds of notes queued ahead of the audio clock
const TICK_MS = 25;              // how often the scheduler tops up the queue
const UNDO_MS = 5000;            // how long the clear button offers to bring the bugs back
const USE_CLIPS = true;          // the ElevenLabs clips in assets/ (see README); false plays everything synthesized
const ASSET_V = 1;               // bump after replacing any file in assets/
const CLIP_TRIM = {              // per-clip volume, evening out the recordings (the beetle and the clap came out quiet)
  'bug-beetle': 5.6, 'bug-ladybird': 7.2, 'bug-cricket': 1.35, 'bug-frog': 0.48, 'bug-bee': 0.6, 'sfx-whoosh': 0.62,
};
const CLIP_CUT = {               // [start, length] in seconds of the recording, so each bug is one short hit on its beat
  'bug-cricket': [0.01, 0.07], 'bug-frog': [0, 0.35], 'bug-bee': [0, 0.32],
};

// One row per bug, top to bottom. 'tune' rows hold a lane (0-4) per beat; the others are on/off.
const ROWS = [
  { id: 'bee', tune: true, label: 'Bee' },
  { id: 'cricket', label: 'Cricket' },
  { id: 'ladybird', label: 'Ladybird' },
  { id: 'frog', label: 'Frog' },
  { id: 'beetle', label: 'Beetle' },
];
// Patterns for the dice (x = a bug; digits are bee lanes, . = empty)
const SURPRISES = [
  { bee: '0.2.4.2.', cricket: 'x.x.x.x.', ladybird: '..x...x.', frog: 'x.....x.', beetle: 'x...x...' },
  { bee: '4.3.2.0.', cricket: 'xxxxxxxx', ladybird: '..x...x.', frog: '...x...x', beetle: 'x..x..x.' },
  { bee: '2..2.4..', cricket: '.x.x.x.x', ladybird: '....x...', frog: 'x.x.....', beetle: 'x.......' },
  { bee: '0.1.2.3.', cricket: 'x..xx..x', ladybird: '..x..x..', frog: 'x...x...', beetle: 'x.x...x.' },
  { bee: '........', cricket: 'x.x.x.x.', ladybird: '..x...x.', frog: '.x...x..', beetle: 'x...x.x.' },
];
const START_PATTERN = { bee: '0...2...', cricket: 'x.x.x.x.', ladybird: '..x...x.', frog: '........', beetle: 'x...x...' };

/* ======== small helpers ======== */
const NS = 'beatbugs.';
const load = (k, d = null) => { try { const v = localStorage.getItem(NS + k); return v === null ? d : v; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, String(v)); } catch {} };
const TEST = /[?&]tbxtest\b/.test(location.search) || navigator.webdriver === true;
const $ = (id) => document.getElementById(id);
const midiHz = (m) => 440 * 2 ** ((m - 69) / 12);

/* ======== bug pictures ======== */
// Every bug faces you; .mc is the closed smile, .mo the open singing mouth.
const EYES = (y, x1 = 25, x2 = 35, r = 4.6) => `<circle cx="${x1}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x2}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x1 + 0.8}" cy="${y + 0.8}" r="${r * 0.52}" fill="#1b1b24"/><circle cx="${x2 + 0.8}" cy="${y + 0.8}" r="${r * 0.52}" fill="#1b1b24"/><circle cx="${x1 + 1.8}" cy="${y - 0.6}" r="${r * 0.2}" fill="#fff"/><circle cx="${x2 + 1.8}" cy="${y - 0.6}" r="${r * 0.2}" fill="#fff"/>`;
const MOUTH = (y, stroke = '#fff', w = 4) => `<path class="mc" d="M${30 - w} ${y}q${w} 3.4 ${w * 2} 0" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/><ellipse class="mo" cx="30" cy="${y + 1.2}" rx="2.8" ry="3.2" fill="#ff5d7e" stroke="${stroke}" stroke-width="1.2"/>`;
const LEGS = (c) => `<g stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none"><path d="M15 32 7 28M14 40 6 42M17 48 10 54M45 32l8-4M46 40l8 2M43 48l7 6"/></g>`;
const BUGS = {
  beetle: `${LEGS('#1f2a37')}<ellipse cx="30" cy="39" rx="17" ry="16" fill="#2E8B9A"/><path d="M30 25v30" stroke="#1d6470" stroke-width="2.5"/><ellipse cx="22" cy="36" rx="3" ry="5" fill="#7fd1dc" opacity=".8"/><path d="M27 12l3-9 3 9z" fill="#1f2a37"/><circle cx="30" cy="20" r="10.5" fill="#1f2a37"/>${EYES(18)}${MOUTH(24.5)}`,
  ladybird: `${LEGS('#1f1f28')}<g stroke="#1f1f28" stroke-width="1.8" fill="none"><path d="M26 12q-3-7-8-8M34 12q3-7 8-8"/></g><circle cx="18" cy="4" r="2.2" fill="#1f1f28"/><circle cx="42" cy="4" r="2.2" fill="#1f1f28"/><circle cx="30" cy="39" r="17" fill="#E8413C"/><path d="M30 23v32" stroke="#1f1f28" stroke-width="2.5"/><g fill="#1f1f28"><circle cx="22" cy="33" r="3.4"/><circle cx="38" cy="33" r="3.4"/><circle cx="20" cy="44" r="2.8"/><circle cx="40" cy="44" r="2.8"/><circle cx="25" cy="51" r="2.2"/><circle cx="35" cy="51" r="2.2"/></g><circle cx="30" cy="20" r="10.5" fill="#1f1f28"/>${EYES(18)}${MOUTH(24.5)}`,
  cricket: `<g stroke="#3f8f2a" stroke-width="2" fill="none" stroke-linecap="round"><path d="M26 11Q18 0 6 3M34 11Q42 0 54 3"/></g><g fill="#4FA334"><path d="M20 30 L5 46 L12 54 L22 42z"/><path d="M40 30 L55 46 L48 54 L38 42z"/></g><ellipse cx="30" cy="40" rx="11" ry="17" fill="#6CC24A"/><path d="M24 34h12M23 41h14M24 48h12" stroke="#4FA334" stroke-width="2"/><circle cx="30" cy="19" r="10.5" fill="#86D867"/>${EYES(17)}${MOUTH(23.5, '#2f6b1f')}`,
  frog: `<g fill="#3f9b40"><ellipse cx="14" cy="53" rx="7" ry="3.5"/><ellipse cx="46" cy="53" rx="7" ry="3.5"/></g><ellipse cx="30" cy="38" rx="23" ry="17" fill="#52B653"/><ellipse cx="30" cy="45" rx="14" ry="8" fill="#B9E89A"/><circle cx="18" cy="22" r="9" fill="#52B653"/><circle cx="42" cy="22" r="9" fill="#52B653"/>${EYES(21, 18, 42, 5.6)}<circle cx="15" cy="35" r="3" fill="#ff9fb2" opacity=".8"/><circle cx="45" cy="35" r="3" fill="#ff9fb2" opacity=".8"/><path class="mc" d="M18 32q12 8 24 0" fill="none" stroke="#24602a" stroke-width="2.4" stroke-linecap="round"/><path class="mo" d="M19 31q11 13 22 0z" fill="#ff5d7e" stroke="#24602a" stroke-width="2"/>`,
  bee: `<g fill="#E3F6FF" stroke="#8fb8cc" stroke-width="1.5"><ellipse cx="15" cy="28" rx="10" ry="7" transform="rotate(-25 15 28)"/><ellipse cx="45" cy="28" rx="10" ry="7" transform="rotate(25 45 28)"/></g><ellipse cx="30" cy="40" rx="15" ry="15" fill="#FFC93C"/><path d="M16 37h28M17.5 46h25" stroke="#2B2B3A" stroke-width="5"/><path d="M30 55l-2.5 4h5z" fill="#2B2B3A"/><g stroke="#2B2B3A" stroke-width="1.8" fill="none"><path d="M26 12q-2-6-6-7M34 12q2-6 6-7"/></g><circle cx="20" cy="5" r="2" fill="#2B2B3A"/><circle cx="40" cy="5" r="2" fill="#2B2B3A"/><circle cx="30" cy="20" r="10.5" fill="#2B2B3A"/>${EYES(18)}${MOUTH(24.5, '#ffb3c6')}`,
};
const bugSvg = (id) => `<svg class="bug" viewBox="0 0 60 60" aria-hidden="true">${BUGS[id]}</svg>`;
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>',
  clear: '<svg viewBox="0 0 24 24"><path d="M5 7h14l-1.2 13a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="#8a6d3b"/><path d="M3.5 6h17M9.5 6V3.8h5V6" stroke="#8a6d3b" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M10 10.5v7M14 10.5v7" stroke="#FFF8E7" stroke-width="1.8" stroke-linecap="round"/></svg>',
  undo: '<svg viewBox="0 0 24 24"><path d="M9 5 3.5 10.5 9 16" fill="none" stroke="#2f6fa8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10.5h9a6.5 6.5 0 0 1 0 13h-3" fill="none" stroke="#2f6fa8" stroke-width="2.8" stroke-linecap="round"/></svg>',
  soundOn: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2B2B3A"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#2B2B3A" stroke-width="2" stroke-linecap="round"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2B2B3A"/><path d="M16.5 9.5l5 5m0-5-5 5" stroke="#F25C54" stroke-width="2.2" stroke-linecap="round"/></svg>',
};

/* ======== sound ======== */
// Each bug has a synthesized voice. With USE_CLIPS on, a recorded clip (assets/bug-<id>.mp3) replaces it once loaded,
// and the synthesized voice stays as the fallback (Blast Off pattern). The bee clip is pitched to each lane with playbackRate.
const CLIPS = ['bug-bee', 'bug-cricket', 'bug-ladybird', 'bug-frog', 'bug-beetle', 'sfx-whoosh'];
const Sound = (() => {
  let ac = null, out = null, noiseBuf = null;
  let muted = TEST || load('muted') === '1';
  const raw = {}, clips = {};   // bytes start loading now; decoding needs the AudioContext from the first tap
  if (USE_CLIPS && !TEST) for (const n of CLIPS) raw[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then((r) => r.ok ? r.arrayBuffer() : null).catch(() => null);
  function ctx() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.8; out.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      for (const n in raw) raw[n].then((b) => b && new Promise((res, rej) => ac.decodeAudioData(b, res, rej)))
        .then((buf) => { if (buf) clips[n] = buf; }).catch(() => {});
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(t, peak, dur, attack = 0.005) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, f2) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function clip(name, t, rate = 1) {   // false when the clip isn't loaded, so the caller synthesizes instead
    const buf = clips[name]; if (!buf) return false;
    const s = ac.createBufferSource(), g = ac.createGain();
    const [off, len] = CLIP_CUT[name] || [0, buf.duration], end = t + len / rate, vol = 0.9 * (CLIP_TRIM[name] ?? 1);
    s.buffer = buf; s.playbackRate.value = rate;
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, Math.max(t, end - 0.02)); g.gain.linearRampToValueAtTime(0, end);   // short fade, no click at the cut
    s.connect(g).connect(out); s.start(t, off); s.stop(end + 0.01); return true;
  }
  const SYNTH = {
    beetle(t) { osc('sine', 150, t, 0.32, env(t, 0.9, 0.32), 42); osc('triangle', 90, t, 0.05, env(t, 0.25, 0.05)); },
    ladybird(t) {   // a clap: three quick filtered noise bursts
      for (let i = 0; i < 3; i++) {
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), tt = t + i * 0.012;
        s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 1.2;
        s.connect(f); f.connect(env(tt, i === 2 ? 0.5 : 0.3, i === 2 ? 0.16 : 0.02, 0.002)); s.start(tt, Math.random() * 0.3); s.stop(tt + 0.2);
      }
    },
    cricket(t) { for (let i = 0; i < 3; i++) osc('sine', 4300, t + i * 0.022, 0.016, env(t + i * 0.022, 0.12, 0.016, 0.002)); },
    frog(t) {       // "rib-bit": two low throaty pulses
      [0, 0.1].forEach((d, i) => {
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; f.connect(env(t + d, 0.4, 0.09, 0.008));
        osc('sawtooth', i ? 110 : 98, t + d, 0.09, f, i ? 92 : 110);
      });
    },
    bee(t, midi) {
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800; f.connect(env(t, 0.22, 0.28, 0.02));
      const o = osc('sawtooth', midiHz(midi), t, 0.28, f);
      const lfo = ac.createOscillator(), depth = ac.createGain(); lfo.frequency.value = 22; depth.gain.value = midiHz(midi) * 0.02;
      lfo.connect(depth).connect(o.frequency); lfo.start(t); lfo.stop(t + 0.3);
      osc('sine', midiHz(midi), t, 0.28, env(t, 0.12, 0.28, 0.02));
    },
  };
  return {
    get muted() { return muted; },
    get ctx() { return muted ? null : ac; },
    setMuted(m) { muted = m; save('muted', m ? '1' : '0'); if (m) ac?.suspend(); else ctx(); },
    unlock() { ctx(); },
    play(id, t, lane) {
      if (!ac || muted) return;
      t = Math.max(t ?? 0, ac.currentTime);
      const midi = lane == null ? null : MELODY[lane];
      const rate = midi == null ? 1 : 2 ** ((midi - BEE_BASE) / 12);
      if (!clip('bug-' + id, t, rate)) SYNTH[id](t, midi ?? MELODY[0]);
    },
    whoosh() { if (!ctx()) return; const t = ac.currentTime; if (!clip('sfx-whoosh', t)) osc('sine', 300, t, 0.45, env(t, 0.08, 0.45, 0.05), 1200); },
  };
})();

/* ======== pattern ======== */
let pat = {}, tempo = 1, undoPat = null, undoTimer = 0;
function fromStrings(s) {
  const p = {};
  for (const r of ROWS) {
    const str = (s[r.id] || '').padEnd(STEPS, '.');
    p[r.id] = [...str.slice(0, STEPS)].map((c) => r.tune ? ('01234'.includes(c) ? +c : -1) : (c === 'x' ? 1 : 0));
  }
  return p;
}
function loadPattern() {
  try {
    const p = JSON.parse(load('pattern', 'null'));
    if (p && ROWS.every((r) => Array.isArray(p[r.id]) && p[r.id].length === STEPS)) return p;
  } catch {}
  return fromStrings(START_PATTERN);
}
const savePattern = () => save('pattern', JSON.stringify(pat));
const isOn = (r, s) => r.tune ? pat[r.id][s] >= 0 : pat[r.id][s] === 1;
const bugCount = () => ROWS.reduce((n, r) => n + pat[r.id].filter((v, s) => isOn(r, s)).length, 0);
pat = loadPattern();
tempo = Math.min(TEMPOS.length - 1, Math.max(0, +load('tempo', 1) || 0));

/* ======== the board ======== */
const board = $('board'), playhead = $('playhead');
const cells = ROWS.map(() => []), heads = [];
ROWS.forEach((r, ri) => {
  const h = document.createElement('button');
  h.className = 'head'; h.dataset.r = ri; h.setAttribute('aria-label', r.label); h.innerHTML = bugSvg(r.id);
  board.appendChild(h); heads.push(h);
  for (let s = 0; s < STEPS; s++) {
    const c = document.createElement('button');
    c.className = 'cell' + (r.tune ? ' tune' : '') + (Math.floor(s / 4) % 2 ? ' beat2' : '');
    c.dataset.r = ri; c.dataset.s = s; c.style.setProperty('--d', ri * 3 + s);
    c.setAttribute('aria-label', `${r.label}, beat ${s + 1}`);
    board.appendChild(c); cells[ri].push(c);
  }
});
function renderCell(ri, s, popIt = false) {
  const r = ROWS[ri], c = cells[ri][s], on = isOn(r, s);
  c.classList.toggle('has', on); c.classList.remove('fly');
  if (!on) { c.querySelector('.bug')?.remove(); return; }
  if (!c.querySelector('.bug')) c.insertAdjacentHTML('beforeend', bugSvg(r.id));
  if (r.tune) c.style.setProperty('--lane', pat[r.id][s]);
  if (popIt) restartClass(c, 'pop');
}
function renderAll() { ROWS.forEach((r, ri) => { for (let s = 0; s < STEPS; s++) renderCell(ri, s); }); }
function restartClass(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function sing(el) {
  restartClass(el, 'hit');
  const n = document.createElement('span'); n.className = 'note'; n.textContent = Math.random() < 0.5 ? '♪' : '♫';
  el.appendChild(n); setTimeout(() => n.remove(), 750);
}

board.addEventListener('click', (e) => {
  const head = e.target.closest('.head');
  if (head) { const r = ROWS[+head.dataset.r]; Sound.unlock(); Sound.play(r.id, 0, r.tune ? 2 : null); sing(head); return; }
  const c = e.target.closest('.cell'); if (!c) return;
  const ri = +c.dataset.r, s = +c.dataset.s, r = ROWS[ri];
  Sound.unlock();
  if (r.tune) {
    // where you tap picks the note: the top of the cell is the highest lane
    const box = c.getBoundingClientRect();
    const lane = Math.max(0, Math.min(4, Math.floor((box.bottom - e.clientY) / box.height * 5)));
    pat[r.id][s] = pat[r.id][s] === lane ? -1 : lane;
  } else pat[r.id][s] = pat[r.id][s] ? 0 : 1;
  const on = isOn(r, s);
  renderCell(ri, s, on);
  if (on) { Sound.play(r.id, 0, r.tune ? pat[r.id][s] : null); }
  dropUndo(); savePattern();
});

/* ======== sizing ======== */
function fit() {
  const wrap = $('wrap'), cs = getComputedStyle(wrap);
  const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = Math.max(3, Math.min(6, Math.round(Math.min(w, h) / 90)));
  // columns as wide as fit; rows may grow up to 1.6x taller (portrait phones) or squeeze cells narrower (landscape)
  const rowsTall = ROWS.length - 1 + 1.9;
  let cw = Math.min((w - gap * 10) / (STEPS + 1), 104);
  const ch = Math.floor(Math.max(24, Math.min((h - gap * 6) / rowsTall, cw * 1.6, 120)));
  cw = Math.floor(Math.max(24, Math.min(cw, ch * 1.3)));
  const root = document.documentElement.style;
  root.setProperty('--cw', cw + 'px'); root.setProperty('--ch', ch + 'px'); root.setProperty('--cell', Math.min(cw, ch) + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
  placePlayhead(seq.shown);
}
function placePlayhead(s) {
  if (s < 0) { playhead.hidden = true; return; }
  const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw'));
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  playhead.hidden = false;
  playhead.style.left = (gap + cell + gap - 3) + 'px';
  playhead.style.transform = `translateX(${s * (cell + gap)}px)`;
}

/* ======== sequencer ======== */
// A lookahead scheduler (like Robot Spy's music) queues each beat ~0.15 s ahead of the audio clock; the pictures follow
// the queue so the hop lands with the sound. Muted (or in a test) it runs on the page clock instead, silently.
const seq = {
  on: false, step: 0, next: 0, timer: 0, queue: [], shown: -1,
  now() { const c = Sound.ctx; return c ? c.currentTime : performance.now() / 1000; },
  stepDur() { return 60 / TEMPOS[tempo].bpm / 2; },
  start() {
    if (this.on) return;
    Sound.unlock();
    this.on = true; this.step = 0; this.queue = []; this.next = this.now() + 0.06;
    this.timer = setInterval(() => this.schedule(), TICK_MS); this.schedule();
    renderPlay();
    window.tbxEvent?.('play', { bugs: bugCount(), tempo: TEMPOS[tempo].label.toLowerCase() });
  },
  stop() {
    this.on = false; clearInterval(this.timer); this.queue = []; this.shown = -1;
    placePlayhead(-1); renderPlay();
  },
  restart() { if (this.on) { this.stop(); this.start(); } },
  schedule() {
    const now = this.now();
    if (this.next < now - 0.05) this.next = now + 0.05;   // timer was held up: skip missed beats rather than play them in a burst
    while (this.next < now + LOOKAHEAD) {
      const s = this.step % STEPS;
      ROWS.forEach((r) => { if (isOn(r, s)) Sound.play(r.id, this.next, r.tune ? pat[r.id][s] : null); });
      this.queue.push({ s, t: this.next }); if (this.queue.length > 64) this.queue.shift();   // no frames drawn (hidden pane): don't pile up
      this.next += this.stepDur(); this.step++;
    }
  },
};
function frame() {
  if (seq.on) {
    const now = seq.now();
    while (seq.queue.length && seq.queue[0].t <= now) {
      const { s } = seq.queue.shift();
      seq.shown = s; placePlayhead(s);
      ROWS.forEach((r, ri) => { if (isOn(r, s)) sing(cells[ri][s]); });
    }
  }
  requestAnimationFrame(frame);
}

/* ======== controls ======== */
function renderPlay() { const p = $('play'); p.classList.toggle('stop', seq.on); p.innerHTML = seq.on ? ICON.stop : ICON.play; p.setAttribute('aria-label', seq.on ? 'Stop' : 'Play'); }
function renderTempo() {
  $('tempo').innerHTML = TEMPOS.map((t, i) => `<button class="key${i === tempo ? ' on' : ''}" data-t="${i}" aria-label="${t.label}">${t.icon}</button>`).join('');
}
function renderMute() { $('mute').innerHTML = Sound.muted ? ICON.soundOff : ICON.soundOn; }
function renderClear() { const c = $('clear'); c.classList.toggle('undo', !!undoPat); c.innerHTML = undoPat ? ICON.undo : ICON.clear; c.setAttribute('aria-label', undoPat ? 'Bring the bugs back' : 'Clear the garden'); }
function dropUndo() { if (!undoPat) return; undoPat = null; clearTimeout(undoTimer); renderClear(); }

$('play').addEventListener('click', () => { seq.on ? seq.stop() : seq.start(); });
$('tempo').addEventListener('click', (e) => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  tempo = +b.dataset.t; save('tempo', tempo); renderTempo();
  Sound.unlock(); Sound.play('cricket', 0);
});
$('dice').addEventListener('click', () => {
  let p; do { p = fromStrings(SURPRISES[Math.floor(Math.random() * SURPRISES.length)]); } while (JSON.stringify(p) === JSON.stringify(pat) && SURPRISES.length > 1);
  pat = p; dropUndo(); savePattern(); Sound.whoosh();
  ROWS.forEach((r, ri) => { for (let s = 0; s < STEPS; s++) renderCell(ri, s, isOn(r, s)); });
  window.tbxEvent?.('surprise', {});
  if (!seq.on) seq.start();
});
$('clear').addEventListener('click', () => {
  if (undoPat) {                       // bring them back
    pat = undoPat; dropUndo(); savePattern(); Sound.whoosh();
    ROWS.forEach((r, ri) => { for (let s = 0; s < STEPS; s++) renderCell(ri, s, isOn(r, s)); });
    return;
  }
  if (!bugCount()) return;
  undoPat = JSON.parse(JSON.stringify(pat));
  pat = fromStrings({}); savePattern(); Sound.whoosh();
  board.querySelectorAll('.cell.has').forEach((c) => restartClass(c, 'fly'));
  setTimeout(() => { if (undoPat) renderAll(); }, 650);
  window.tbxEvent?.('clear', {});
  renderClear(); clearTimeout(undoTimer); undoTimer = setTimeout(dropUndo, UNDO_MS);
});
$('mute').addEventListener('click', () => { Sound.setMuted(!Sound.muted); renderMute(); seq.restart(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && seq.on) seq.stop(); });   // background tabs throttle timers

new ResizeObserver(fit).observe($('wrap'));
renderAll(); renderTempo(); renderPlay(); renderMute(); renderClear(); fit();
requestAnimationFrame(frame);
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js, sound clips) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
